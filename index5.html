    <!-- БЛОК С КАРТОЧКАМИ ИГР (данные из Firestore) -->
    <!-- ========================================== -->
    <h2>🎮 Наши игры</h2>
    <!-- ========================================== -->
    <!-- ПАНЕЛЬ ПОИСКА И ФИЛЬТРОВ                    -->
    <!-- ========================================== -->
    <section class="filters-section">
        <h2>🔍 Поиск и фильтры</h2>
        
        <div class="filters-grid">
            <div class="filter-group">
                <label for="search-input">Поиск по названию:</label>
                <input type="text" id="search-input" placeholder="Введите название...">
            </div>
            
            <div class="filter-group">
                <label for="genre-filter">Жанр:</label>
                <select id="genre-filter">
                    <option value="">Все жанры</option>
                    <option value="RPG">RPG</option>
                    <option value="MOBA">MOBA</option>
                    <option value="Battle Royale">Battle Royale</option>
                    <option value="Шутер">Шутер</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="rating-filter">Мин. рейтинг:</label>
                <input type="number" id="rating-filter" min="0" max="10" step="0.5" placeholder="0">
            </div>
            
            <div class="filter-group">
                <label for="sort-filter">Сортировка:</label>
                <select id="sort-filter">
                    <option value="default">По умолчанию</option>
                    <option value="rating-desc">Рейтинг ↓</option>
                    <option value="rating-asc">Рейтинг ↑</option>
                    <option value="title-asc">Название А-Я</option>
                    <option value="title-desc">Название Я-А</option>
                </select>
            </div>
        </div>
        
        <div class="filters-actions">
            <button id="reset-filters" class="reset-btn">🔄 Сбросить фильтры</button>
            <span id="results-count" class="results-count">Найдено: 0</span>
        </div>
    </section>

    <!-- Сюда JavaScript будет добавлять карточки -->
    <div class="card-container" id="games-container">
        <p id="loading">Загрузка игр...</p>
    </div>

        import { getAuth } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';

    <!-- ========================================== -->
    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ РЕДАКТИРОВАНИЯ          -->
    <!-- ========================================== -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-window">
            <h2>✏️ Редактировать игру</h2>
            
            <form id="edit-form">
                <!-- Скрытое поле для ID документа -->
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label for="edit-title">Название игры:</label>
                    <input type="text" id="edit-title" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-genre">Жанр:</label>
                    <input type="text" id="edit-genre" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-rating">Рейтинг (0-10):</label>
                    <input type="number" id="edit-rating" min="0" max="10" step="0.1" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-imageUrl">Ссылка на картинку:</label>
                    <input type="url" id="edit-imageUrl">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="cancel-edit">Отмена</button>
                    <button type="submit" class="save-btn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    
</section>
